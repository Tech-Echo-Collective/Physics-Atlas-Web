name: Deploy Atlas Physicus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ATLAS_API_URL: ${{ vars.VITE_ATLAS_API_URL }}
    steps:
      - name: Check out the deployment repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the public API configuration
        run: >-
          node -e "const url = new URL(process.env.VITE_ATLAS_API_URL);
          if (url.protocol !== 'https:') throw new Error('VITE_ATLAS_API_URL must use HTTPS');"

      - name: Validate the deployment adapter
        run: |
          npm run lint
          npm test

      - name: Build the public Atlas
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
